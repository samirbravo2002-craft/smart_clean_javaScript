<!-- login.component.html -->
<div class="container-fluid p-0 vh-100">
  <div class="row g-0 h-100">
    <!-- Columna izquierda - Recuadro Azul -->
    <div class="col-lg-6 d-none d-lg-flex align-items-center justify-content-center bg-custom-primary">
      <div class="text-center text-white p-5">
        <div class="mb-4">
          <img src="/sc-logo.png" alt="SmartClean Logo" class="img-fluid">
        </div>
      </div>
    </div>

    <!-- Columna derecha - Formulario -->
    <div class="col-lg-6 d-flex align-items-center justify-content-center" style="background: #ffffff;">
      <div class="w-100 px-4 px-md-5" style="max-width: 440px;">
        <!-- Logo en mobile -->
        <div class="text-center mb-4 d-lg-none">
          <h2 class="fw-bold text-primary">SmartClean</h2>
        </div>

        <!-- Título -->
        <div class="mb-4">
          <h4 class="fw-bold mb-1">Bienvenido</h4>
          <p class="text-muted small">Ingresa tus credenciales para continuar</p>
        </div>

        <!-- Mensaje de error -->
        <div *ngIf="errorMessage" class="alert alert-danger py-2 small" role="alert">
          <i class="bi bi-exclamation-circle me-1"></i>
          {{ errorMessage }}
        </div>

        <!-- Formulario -->
        <form #loginForm="ngForm" (ngSubmit)="onLogin()">
          <!-- Email -->
          <div class="mb-3">
            <label for="email" class="form-label fw-semibold small">Correo electrónico</label>
            <input 
              id="email" 
              type="email" 
              class="form-control" 
              placeholder="usuario@ejemplo.com"
              [(ngModel)]="email"
              name="email"
              #emailInput="ngModel"
              required
              email
              [class.is-invalid]="emailInput.invalid && emailInput.touched"
            />
            <div *ngIf="emailInput.invalid && emailInput.touched" class="invalid-feedback small">
              <div *ngIf="emailInput.errors?.['required']">El correo es obligatorio</div>
              <div *ngIf="emailInput.errors?.['email']">Ingresa un correo válido</div>
            </div>
          </div>

          <!-- Contraseña -->
          <div class="mb-4">
            <div class="d-flex justify-content-between align-items-center">
              <label for="password" class="form-label fw-semibold small mb-0">Contraseña</label>
              <a href="#" class="text-decoration-none small" style="color: #1a56db;" (click)="$event.preventDefault()">
                ¿Olvidó su contraseña?
              </a>
            </div>
            <input 
              id="password" 
              type="password" 
              class="form-control mt-1" 
              placeholder="********"
              [(ngModel)]="password"
              name="password"
              #passwordInput="ngModel"
              required
              minlength="6"
              [class.is-invalid]="passwordInput.invalid && passwordInput.touched"
            />
            <div *ngIf="passwordInput.invalid && passwordInput.touched" class="invalid-feedback small">
              <div *ngIf="passwordInput.errors?.['required']">La contraseña es obligatoria</div>
              <div *ngIf="passwordInput.errors?.['minlength']">Mínimo 6 caracteres</div>
            </div>
          </div>

          <!-- Botón -->
          <button 
            type="submit" 
            class="btn btn-custom-primary w-100 py-2 fw-bold text-white"
            /* [disabled]="loginForm.invalid || isLoading" */
          >
            <span *ngIf="!isLoading">Iniciar Sesión</span>
            <span *ngIf="isLoading">
              <span class="spinner-border spinner-border-sm me-2" role="status"></span>
              Cargando...
            </span>
          </button>
        </form>

        <!-- Registro -->
        <div class="mt-4 text-center">
          <p class="text-muted small mb-0">
            ¿No tienes cuenta? 
            <a routerLink="/registro" class="text-decoration-none fw-semibold" style="color: #1a56db;">Regístrate</a>
          </p>
        </div>

        <!-- Credenciales de prueba -->
        <div class="mt-4 pt-3 border-top">
          <p class="text-center text-muted small mb-2">
            <span class="badge bg-light text-dark me-1">Prueba</span>
            admin@smartclean.com / admin123
          </p>
        </div>
      </div>
    </div>
  </div>
</div>
