<div class="container-fluid">
  <div class="row flex-nowrap">

    <!-- CONTENEDOR DE LA BARRA LATERAL -->
    <div *ngIf="showSidebar" [ngClass]="{
      'col-auto': !sidebarExpanded,
      'col-md-3 col-xl-2': sidebarExpanded
    }" class="px-sm-2 px-0 min-vh-100 d-flex flex-column justify-content-between transition-sidebar" style="background-color: var(--color-primary);">
      
      <div class="d-flex flex-column align-items-center align-items-sm-start px-3 pt-2 text-white">

        <!-- Logo / Marca con botón toggle -->
        <div class="d-flex justify-content-between align-items-center w-100 pb-3 mb-md-0">
          <a routerLink="dashboard" class="d-flex align-items-center text-white text-decoration-none">
            <span class="fs-5" [class.d-none]="!sidebarExpanded">SmarClean</span>
          </a>
          
          <!-- Botón para colapsar/expandir -->
          <button (click)="toggleSidebar()" class="btn btn-link text-white p-0" type="button">
            <i [class]="sidebarExpanded ? 'bi bi-chevron-left' : 'bi bi-chevron-right'"></i>
          </button>
        </div>

        <!-- Menú de Enlaces -->
        <ul class="nav nav-pills flex-column mb-sm-auto mb-0 align-items-center align-items-sm-start w-100" id="menu">
          <li class="nav-item w-100">
            <a routerLink="dashboard" class="nav-link align-middle px-0 text-white" 
               [class.justify-content-center]="!sidebarExpanded" [class.justify-content-start]="sidebarExpanded"
               style="display: flex; gap: 1rem;">
              <i class="bi bi-graph-up fs-2"></i>
              <span [class.d-none]="!sidebarExpanded">Dashboard</span>
            </a>
          </li>
          <li class="w-100">
            <a routerLink="reservas" class="nav-link px-0 align-middle text-white"
               [class.justify-content-center]="!sidebarExpanded" [class.justify-content-start]="sidebarExpanded"
               style="display: flex; gap: 1rem;">
              <i class="bi bi-car-front-fill fs-2"></i>
              <span [class.d-none]="!sidebarExpanded">Reservas</span>
            </a>
          </li>
          <li class="w-100">
            <a routerLink="novedades" class="nav-link px-0 align-middle text-white"
               [class.justify-content-center]="!sidebarExpanded" [class.justify-content-start]="sidebarExpanded"
               style="display: flex; gap: 1rem;">
              <i class="bi bi-bell-fill fs-2"></i>
              <span [class.d-none]="!sidebarExpanded">Novedades</span>
            </a>
          </li>
          <li class="w-100">
            <a routerLink="gerencia" class="nav-link px-0 align-middle text-white"
               [class.justify-content-center]="!sidebarExpanded" [class.justify-content-start]="sidebarExpanded"
               style="display: flex; gap: 1rem;">
              <i class="bi bi-grid fs-2"></i> 
              <span [class.d-none]="!sidebarExpanded">Gerencia</span>
            </a>
          </li>
        </ul>

      </div>

      <!-- Menú desplegable de Usuario (Pie de la barra) -->
      <div class="dropdown pb-4 px-3" [class.text-center]="!sidebarExpanded">
        <a href="#" class="d-flex align-items-center text-white text-decoration-none dropdown-toggle" 
           [class.justify-content-center]="!sidebarExpanded" [class.justify-content-start]="sidebarExpanded"
           style="display: flex; gap: 0.5rem;"
           id="dropdownUser1" data-bs-toggle="dropdown" aria-expanded="false">
          <i class="bi bi-person-circle fs-4"></i>
          <span [class.d-none]="!sidebarExpanded">Usuario</span>
        </a>
        <ul class="dropdown-menu dropdown-menu-dark text-small shadow" aria-labelledby="dropdownUser1">
          <li><a class="dropdown-item" href="#">Configuración</a></li>
          <li><a class="dropdown-item" href="#">Perfil</a></li>
          <li>
            <hr class="dropdown-divider">
          </li>
          <li><a class="dropdown-item" routerLink="login">Cerrar sesión</a></li>
        </ul>
      </div>

    </div>

    <!-- CONTENIDO PRINCIPAL DE LA PÁGINA -->
    <div class="col py-3 px-0">
      <router-outlet></router-outlet>
    </div>

  </div>
</div>
